name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install LLVM 23 MLIR tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/fovea-llvm.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/fovea-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' | sudo tee /etc/apt/sources.list.d/fovea-llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y mlir-23-tools clang-23
          echo '/usr/lib/llvm-23/bin' >> "$GITHUB_PATH"

      - name: Run lint and typography check
        run: |
          python3 check_no_em_dash.py

      - name: Run test suite
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Execute example pipelines
        run: |
          python3 examples/01_raw_to_rgb_quickstart.py
          python3 examples/02_burst_hdr_exposure_fusion.py
          python3 examples/03_inspect_mlir_passes.py
          python3 examples/04_custom_kernel_lowering.py
          python3 examples/05_realtime_stream_simulation.py

      - name: Run performance benchmark suite
        run: |
          python3 benchmarks/run_all_benchmarks.py
