[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fovea"
version = "0.1.0"
description = "A multi-level intermediate representation compiler and domain-specific code generator for high-throughput computational photography, Bayer demosaicing, and real-time image signal processing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aneesh Krishna Parthasarathy", email = "aneeshkrishnaparthasarathy@gmail.com" }
]
keywords = ["mlir", "computational-photography", "image-signal-processor", "compiler", "affine", "simd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Compilers",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
fovea = "fovea.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
